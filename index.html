<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wellwish CRM — Updated</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f1729">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Wellwish">

<style>
:root{
  --navy:#0f1729; --navy-2:#16213a; --navy-line:#26314f;
  --bg:#f3f5f9; --card:#ffffff; --border:#e2e6ee; --border-2:#eceff4;
  --text:#1c2333; --text-dim:#6b7385; --text-faint:#9aa1b0;
  --blue:#2f5fe0; --blue-light:#eaf0fe;
  --hot:#e0432f; --hot-light:#fde9e6;
  --warm:#e69414; --warm-light:#fdf1dc;
  --cold:#4a7adb; --cold-light:#eaf0fc;
  --green:#19a566; --green-light:#e3f7ee;
  --gray:#8b91a0; --gray-light:#eef0f4;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;}
button{font-family:inherit;}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
@media (max-width:900px){ .app{grid-template-columns:1fr;} .sidebar{position:fixed;z-index:40;height:100vh;transform:translateX(-100%);transition:transform .2s;} .sidebar.open{transform:translateX(0);} .menu-btn{display:inline-flex !important;} }

/* Sidebar */
.sidebar{background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:18px 0;}
.sb-brand{padding:6px 20px 20px;border-bottom:1px solid var(--navy-line);margin-bottom:10px;}
.sb-brand .name{font-weight:700;font-size:17px;letter-spacing:-0.01em;}
.sb-brand .sub{font-size:11px;color:#8893ad;margin-top:2px;}
.sb-nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#b6bdd0;cursor:pointer;font-size:13.5px;font-weight:500;}
.sb-item:hover{background:var(--navy-2);color:#fff;}
.sb-item.active{background:var(--blue);color:#fff;}
.sb-item .dot{width:7px;height:7px;border-radius:50%;background:var(--hot);margin-left:auto;}
.sb-foot{margin-top:auto;padding:14px 20px 4px;font-size:11px;color:#5d6680;border-top:1px solid var(--navy-line);}

/* Top bar */
.main{display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;}
.menu-btn{display:none;background:none;border:1px solid var(--border);border-radius:8px;width:34px;height:34px;align-items:center;justify-content:center;cursor:pointer;font-size:18px;}
.page-title{font-size:18px;font-weight:700;letter-spacing:-0.01em;}
.topbar .search{flex:1;max-width:380px;margin-left:10px;}
.search input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13.5px;color:var(--text);}
.search input:focus{outline:none;border-color:var(--blue);}
.btn{border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{border-color:var(--blue);color:var(--blue);}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.btn-primary:hover{background:#2750c4;color:#fff;}
.btn-sm{padding:6px 10px;font-size:12px;}
.content{padding:24px 26px;flex:1;}

/* Dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
@media (max-width:900px){ .stat-grid{grid-template-columns:repeat(2,1fr);} }
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
.stat-card .num{font-size:26px;font-weight:700;letter-spacing:-0.01em;}
.stat-card .lbl{font-size:12px;color:var(--text-dim);margin-top:2px;font-weight:500;}
.stat-card.hot .num{color:var(--hot);} .stat-card.warm .num{color:var(--warm);} .stat-card.cold .num{color:var(--cold);} .stat-card.green .num{color:var(--green);}

.panel-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:900px){ .panel-row{grid-template-columns:1fr;} }
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.panel h3{font-size:14px;margin:0 0 12px;font-weight:700;}
.mini-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border-2);font-size:13px;}
.mini-row:last-child{border-bottom:none;}
.mini-row .who{font-weight:600;}
.mini-row .when{color:var(--text-dim);font-size:12px;}
.empty-mini{color:var(--text-faint);font-size:13px;padding:10px 0;}

/* Filters */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.filter-bar select{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--text);}
.filter-bar select:focus{outline:none;border-color:var(--blue);}
.tab-row{display:flex;gap:6px;margin-bottom:14px;}
.tab{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;}
.tab.active{background:var(--blue-light);color:var(--blue);}

/* Lead table */
.lead-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.lead-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg);}
.lead-table td{padding:11px 14px;border-bottom:1px solid var(--border-2);font-size:13px;vertical-align:middle;}
.lead-table tr:last-child td{border-bottom:none;}
.lead-table tr.row{cursor:pointer;}
.lead-table tr.row:hover{background:var(--bg);}
.heat-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block;}
.heat-pill.Hot{background:var(--hot-light);color:var(--hot);}
.heat-pill.Warm{background:var(--warm-light);color:var(--warm);}
.heat-pill.Cold{background:var(--cold-light);color:var(--cold);}
.status-pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--gray-light);color:var(--gray);display:inline-block;}
.status-pill.Client, .status-pill.BusinessPartner{background:var(--green-light);color:var(--green);}
.qa-cell{display:flex;gap:6px;}
.qa-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;text-decoration:none;color:var(--text);}
.qa-btn:hover{border-color:var(--blue);color:var(--blue);}
.qa-btn-sms{opacity:0.55;}
.qa-btn-sms:hover{opacity:1;border-color:var(--blue);color:var(--blue);}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);}
.empty-state h3{color:var(--text);font-size:16px;margin-bottom:6px;}

/* Lead detail drawer */
.overlay{position:fixed;inset:0;background:rgba(15,20,35,0.45);display:flex;justify-content:flex-end;z-index:50;}
.drawer{background:var(--card);width:100%;max-width:560px;height:100vh;overflow-y:auto;padding:26px 28px;}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
.drawer-head h2{font-size:20px;margin:0;}
.drawer-head .co{color:var(--text-dim);font-size:13px;margin-top:3px;}
.close-x{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-dim);}
.qa-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.qa-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--card);text-decoration:none;color:var(--text);}
.qa-pill:hover{border-color:var(--blue);color:var(--blue);}
.qa-pill.archive{color:var(--hot);border-color:#f5d3cd;}
.qa-pill.restore{color:var(--green);border-color:#bfe9d4;}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.field{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 12px;}
.field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:4px;font-weight:600;}
.field input, .field select{width:100%;background:none;border:none;font-size:13.5px;color:var(--text);padding:0;font-family:inherit;}
.field input:focus, .field select:focus{outline:none;}
.section-title{font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);font-weight:700;margin:22px 0 10px;}
.note-add{display:flex;gap:8px;margin-bottom:14px;}
.note-add textarea{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13px;font-family:inherit;resize:vertical;min-height:42px;}
.note-add textarea:focus{outline:none;border-color:var(--blue);}
.note-add button{background:var(--blue);color:#fff;border:none;border-radius:9px;padding:0 16px;font-weight:600;font-size:13px;cursor:pointer;}
.note{border-left:2px solid var(--border);padding:3px 0 3px 14px;margin-bottom:12px;}
.note .when{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
.note .body{font-size:13px;margin-top:2px;line-height:1.5;}

/* Session feature */
.session-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:20px;}
.session-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.session-row:last-child{margin-bottom:0;}
.session-row label{font-size:12px;font-weight:600;color:var(--text-dim);}
.session-toggle{display:flex;gap:6px;}
.session-toggle button{border-radius:7px;border:1px solid var(--border);background:var(--card);padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-dim);}
.session-toggle button.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.session-toggle button.on.joined{background:var(--green);border-color:var(--green);}
.session-toggle button.on.notjoined{background:var(--hot);border-color:var(--hot);}
.session-field{margin-top:4px;}
.session-field textarea, .session-field input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;}
.session-field textarea{resize:vertical;min-height:38px;}
.reminder-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:11.5px;font-weight:600;cursor:pointer;background:var(--card);color:var(--text-dim);}
.reminder-chip.sent{background:var(--green-light);border-color:#bfe9d4;color:var(--green);}
.session-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-block;}
.session-badge.joined{background:var(--green-light);color:var(--green);}
.session-badge.notjoined{background:var(--hot-light);color:var(--hot);}
.session-badge.pending{background:var(--warm-light);color:var(--warm);}
.session-badge.invited{background:var(--blue-light);color:var(--blue);}

/* Add modal */
.modal{background:var(--card);border-radius:14px;padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;}
.modal h3{margin:0 0 16px;font-size:18px;}
.modal .field{margin-bottom:10px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,35,0.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
</style>
</head>

function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function fmtDate(d){ if(!d) return "—"; return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }

function waLink(phone){ const clean = (phone||"").replace(/[^0-9]/g,""); return clean ? `https://wa.me/${clean}` : null; }
function telLink(phone){ return phone ? `tel:${phone}` : null; }
function smsLink(phone){ return phone ? `sms:${phone}` : null; }

function heatOf(lead){
  if(lead.archived) return "Cold";
  if(["Client","Business Partner","Lost"].includes(lead.status)) return "Cold";
  const today = todayStr();
  if(lead.nextFollowUp){
    const diff = daysBetween(today, lead.nextFollowUp);
    if(diff <= 0) return "Hot";
    if(diff <= 3) return "Warm";
    return "Cold";
  }
  if(lead.lastContact){
    const since = daysBetween(lead.lastContact, today);
    if(since <= 2) return "Warm";
    return "Cold";
  }
  return "Warm";
}

function loadLeads(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return SAMPLE;
}
function saveLeads(leads){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(leads)); }catch(e){}
}

function exportExcel(leads){
  const rows = leads.map(l => ({
    Name:l.name, Phone:l.phone, Email:l.email, Type:l.category, Goal:l.goal, Source:l.source,
    Status:l.status, Archived:l.archived?"Yes":"No", "Last Contact":l.lastContact||"", "Next Follow-up":l.nextFollowUp||"",
    "Created":l.createdAt ? l.createdAt.slice(0,10) : ""
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Leads");
  XLSX.writeFile(wb, `ledger-crm-export-${todayStr()}.xlsx`);
}

function backupJSON(leads){
  const blob = new Blob([JSON.stringify(leads, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `ledger-crm-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function handleRestoreFile(e, setLeads){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const data = JSON.parse(ev.target.result);
      if(Array.isArray(data)){
        if(window.confirm(`Restore will replace your current ${data.length} leads. Continue?`)){
          setLeads(data);
        }
      } else { window.alert("This doesn't look like a valid backup file."); }
    }catch(err){ window.alert("Couldn't read that file. Make sure it's a Wellwish CRM backup .json file."); }
  };
  reader.readAsText(file);
  e.target.value = "";
}

  {key:"name", label:"Name", required:true},
  {key:"phone", label:"Phone", required:true},
  {key:"email", label:"Email"},

function ImportModal({ onClose, onImport }){
  const [step, setStep] = useState(1);
  const [sheetRows, setSheetRows] = useState([]);
  const [headers, setHeaders] = useState([]);
  const [mapping, setMapping] = useState({});
  const fileRef = useRef(null);

  const handleFile = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const wb = XLSX.read(ev.target.result, {type:"binary"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, {defval:""});
      if(json.length === 0){ window.alert("That file has no rows."); return; }
      setHeaders(Object.keys(json[0]));
      setSheetRows(json);
      const auto = {};
      CRM_FIELDS.forEach(f => {
        const match = Object.keys(json[0]).find(h => h.toLowerCase().includes(f.key) || h.toLowerCase().includes(f.label.split(" ")[0].toLowerCase()));
        if(match) auto[f.key] = match;
      });
      setMapping(auto);
      setStep(2);
    };
    reader.readAsBinaryString(file);
  };

  const doImport = () => {
    if(!mapping.name || !mapping.phone){ window.alert("Map at least Name and Phone before importing."); return; }
    const newLeads = sheetRows.map(row => ({
      id: uid(),
      name: String(row[mapping.name]||"").trim(),
      phone: String(row[mapping.phone]||"").trim(),
      email: mapping.email ? String(row[mapping.email]||"") : "",
      category: mapping.category ? String(row[mapping.category]||"Health") : "Health",
      goal: mapping.goal ? String(row[mapping.goal]||"Other") : "Other",
      source: mapping.source ? String(row[mapping.source]||"Other") : "Other",
      status: mapping.status && STATUSES.includes(String(row[mapping.status])) ? String(row[mapping.status]) : "New",
      archived: false, createdAt: new Date().toISOString(),
      lastContact:"", nextFollowUp:"", notes:[]
    })).filter(l => l.name);
    onImport(newLeads);
  };

  return (
    <div className="modal-overlay" onClick={(e)=>{ if(e.target.className==='modal-overlay') onClose(); }}>
      <div className="modal" style={{maxWidth:520}}>
        <h3>Import leads from Excel</h3>
        {step===1 && (
          <div>
            <p style={{fontSize:13, color:"var(--text-dim)", marginBottom:14}}>Choose an .xlsx or .csv file. You'll match its columns to CRM fields next.</p>
            <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleFile} />
          </div>
        )}
        {step===2 && (
          <div>
            <p style={{fontSize:13, color:"var(--text-dim)", marginBottom:14}}>Found {sheetRows.length} rows. Match each CRM field to a column from your file (Name and Phone are required).</p>
            {CRM_FIELDS.map(f => (
              <div className="field" key={f.key}>
                <label>{f.label}{f.required && " *"}</label>
                <select value={mapping[f.key]||""} onChange={e=>setMapping({...mapping, [f.key]:e.target.value})}>
                  <option value="">— Don't import —</option>
                  {headers.map(h => <option key={h} value={h}>{h}</option>)}
                </select>
              </div>
            ))}
          </div>
        )}
        <div className="modal-actions">
          <button className="btn" onClick={onClose}>Cancel</button>
          {step===2 && <button className="btn btn-primary" onClick={doImport}>Import {sheetRows.length} leads</button>}
        </div>
      </div>
    </div>
  );
}

function DailyTasks({ tasks, setTasks }){
  const today = todayStr();
  const todayData = tasks[today] || emptyDay();

  const bump = (key, delta) => {
    const cur = todayData[key] || 0;
    const next = Math.max(0, cur + delta);
    const updated = { ...tasks, [today]: { ...todayData, [key]: next } };
    setTasks(updated);
  };

  const history = Object.keys(tasks).sort().reverse().slice(0, 7);

  return (
    <div>
      <div className="stat-grid" style={{gridTemplateColumns:"repeat(5,1fr)"}}>
        {DAILY_TASKS.map(t => {
          const val = todayData[t.key] || 0;
          const hit = t.min > 0 ? val >= t.min : true;
          const pct = t.min > 0 ? Math.min(100, Math.round((val/t.min)*100)) : 100;
          return (
            <div className="panel" key={t.key} style={{padding:"16px 18px"}}>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start"}}>
                <div>
                  <div style={{fontSize:12, color:"var(--text-dim)", fontWeight:600}}>{t.icon} {t.label}</div>
                  <div style={{fontSize:26, fontWeight:700, marginTop:4, color: hit ? "var(--green)" : "var(--text)"}}>{val}{t.min>0 && <span style={{fontSize:14, color:"var(--text-faint)", fontWeight:500}}> / {t.min}</span>}</div>
                </div>
              </div>
              {t.min > 0 && (
                <div style={{height:6, background:"var(--border-2)", borderRadius:4, marginTop:10, overflow:"hidden"}}>
                  <div style={{height:"100%", width:pct+"%", background: hit ? "var(--green)" : "var(--blue)", borderRadius:4}}></div>
                </div>
              )}
              <div style={{display:"flex", gap:6, marginTop:12}}>
                <button className="btn btn-sm" onClick={()=>bump(t.key,-1)}>−</button>
                <button className="btn btn-sm btn-primary" onClick={()=>bump(t.key,1)} style={{flex:1}}>+1</button>
              </div>
            </div>
          );
        })}
      </div>

      <div className="panel">
        <h3>Last 7 days</h3>
        <table className="lead-table">
          <thead><tr><th>Date</th>{DAILY_TASKS.map(t => <th key={t.key}>{t.label}</th>)}</tr></thead>
          <tbody>
            {history.length === 0 && <tr><td colSpan={DAILY_TASKS.length+1} style={{color:"var(--text-faint)"}}>No activity logged yet.</td></tr>}
            {history.map(date => (
              <tr key={date}>
                <td style={{fontWeight:600}}>{date===today ? "Today" : fmtDate(date)}</td>
                {DAILY_TASKS.map(t => {
                  const v = (tasks[date] && tasks[date][t.key]) || 0;
                  const hit = t.min > 0 ? v >= t.min : true;
                  return <td key={t.key} style={{color: hit ? "var(--green)" : "var(--text)"}}>{v}{t.min>0?`/${t.min}`:""}</td>;
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Reports({ leads }){
  const stats = useMemo(() => {
    const clients = leads.filter(l => l.status==="Client").length;
    const partners = leads.filter(l => l.status==="Business Partner").length;
    const trialStarted = leads.filter(l => l.status==="Trial Started").length;
    const trialCompleted = leads.filter(l => l.status==="Trial Completed").length;
    const lost = leads.filter(l => l.status==="Lost").length;
    return { clients, partners, trialStarted, trialCompleted, lost };
  }, [leads]);

  const monthly = useMemo(() => {
    const map = {};
    leads.forEach(l => {
      const d = new Date(l.createdAt);
      const key = d.toLocaleString(undefined, {month:"short", year:"numeric"});
      if(!map[key]) map[key] = { key, total:0, converted:0, sortKey: d.getFullYear()*12+d.getMonth() };
      map[key].total++;
      if(l.status==="Client" || l.status==="Business Partner") map[key].converted++;
    });
    return Object.values(map).sort((a,b)=>b.sortKey-a.sortKey);
  }, [leads]);

  return (
    <div>
      <div className="stat-grid">
        <div className="stat-card green"><div className="num">{stats.clients}</div><div className="lbl">Total clients</div></div>
        <div className="stat-card green"><div className="num">{stats.partners}</div><div className="lbl">Business joins</div></div>
        <div className="stat-card"><div className="num">{stats.trialStarted}</div><div className="lbl">Trial started</div></div>
        <div className="stat-card"><div className="num">{stats.trialCompleted}</div><div className="lbl">Trial completed</div></div>
        <div className="stat-card hot"><div className="num">{stats.lost}</div><div className="lbl">Lost leads</div></div>
      </div>
      <div className="panel">
        <h3>Monthly conversion report</h3>
        <table className="lead-table">
          <thead><tr><th>Month</th><th>New leads</th><th>Converted</th><th>Rate</th></tr></thead>
          <tbody>
            {monthly.map(m => (
              <tr key={m.key}>
                <td>{m.key}</td><td>{m.total}</td><td>{m.converted}</td>
                <td>{m.total ? Math.round((m.converted/m.total)*100) : 0}%</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

  const [showAdd, setShowAdd] = useState(false);
  const [noteDraft, setNoteDraft] = useState("");
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const restoreInputRef = useRef(null);

  useEffect(() => { saveLeads(leads); }, [leads]);
  useEffect(() => { saveTasks(tasks); }, [tasks]);

  const active = leads.find(l => l.id === activeId);

  const updateLead = (id, patch) => setLeads(prev => prev.map(l => {
    if(l.id !== id) return l;
    let next = {...l, ...patch};
    if(patch.status && patch.status !== l.status && AUTO_FOLLOWUP_DAYS[patch.status] !== undefined){
      next.nextFollowUp = addDays(todayStr(), AUTO_FOLLOWUP_DAYS[patch.status]);
    }
    return next;
  }));
  const addNote = (id, entry) => {
    // entry: { type, body, reply } — supports being called with just a string for backwards compatibility
    const data = typeof entry === "string" ? { type:"Other", body:entry, reply:"" } : entry;
    if(!data.body.trim() && !(data.reply||"").trim()) return;
    setLeads(prev => prev.map(l => l.id===id ? {
      ...l,
      notes:[{ when:new Date().toISOString(), type:data.type||"Other", body:data.body.trim(), reply:(data.reply||"").trim() }, ...(l.notes||[])],
      lastContact:todayStr()
    } : l));
  };
  // Auto-logs a quick interaction (Call / WhatsApp) the instant a quick-action button is tapped,
  // so calls/messages are tracked even when no full note is written.
  const logQuickContact = (id, type) => {
    setLeads(prev => prev.map(l => l.id===id ? {
      ...l,
      notes:[{ when:new Date().toISOString(), type, body:`${type} initiated`, reply:"" }, ...(l.notes||[])],
      lastContact:todayStr()
    } : l));
  };

  const activeList = leads.filter(l => !l.archived);
  const archivedList = leads.filter(l => l.archived);

  const dash = useMemo(() => {
    const today = todayStr();
    const totalLeads = leads.length;
    const active_ = activeList.length;
    const archived_ = archivedList.length;
    let hot=0, warm=0, cold=0;
    activeList.forEach(l => { const h = heatOf(l); if(h==="Hot") hot++; else if(h==="Warm") warm++; else cold++; });
    const todayFollowups = activeList.filter(l => l.nextFollowUp === today);
    const overdue = activeList.filter(l => l.nextFollowUp && l.nextFollowUp < today);
    const converted = leads.filter(l => l.status==="Client" || l.status==="Business Partner").length;
    const conversionRate = totalLeads ? Math.round((converted/totalLeads)*100) : 0;
    const thisMonth = new Date().getMonth();
    const thisYear = new Date().getFullYear();
    const newThisMonth = leads.filter(l => { const d = new Date(l.createdAt); return d.getMonth()===thisMonth && d.getFullYear()===thisYear; }).length;
    return { totalLeads, active_, archived_, hot, warm, cold, todayFollowups, overdue, conversionRate, newThisMonth };
  }, [leads]);

  const filteredList = (list) => {
    let arr = [...list];
    if(query.trim()){
      const q = query.toLowerCase();
      arr = arr.filter(l => (l.name+l.phone).toLowerCase().includes(q));
    }
    if(filters.category) arr = arr.filter(l => l.category === filters.category);
    if(filters.goal) arr = arr.filter(l => l.goal === filters.goal);
    if(filters.source) arr = arr.filter(l => l.source === filters.source);
    if(filters.heat) arr = arr.filter(l => heatOf(l) === filters.heat);
    arr.sort((a,b) => {
      const order = {Hot:0,Warm:1,Cold:2};
      return order[heatOf(a)] - order[heatOf(b)];
    });
    return arr;
  };

  const addLead = (data) => {

      id: uid(), name:data.name, phone:data.phone, email:data.email||"",

      lastContact:"", nextFollowUp:"", notes:[]

        <div className="topbar">
          <button className="menu-btn" onClick={()=>setSidebarOpen(true)}>☰</button>
          <div className="page-title">{view==="dashboard"?"Dashboard":view==="sessions"?"Sessions":view==="clubvisits"?"Club Visits":view==="reminders"?"Visit Reminders":view==="bodyrisk"?"Body Risk Evaluation":view==="billing"?"Billing":view==="attendance"?"Attendance":view==="tasks"?"Daily tasks":view==="leads"?"Active leads":view==="archived"?"Archived leads":"Reports"}</div>
          {(view==="leads"||view==="archived") && (
            <div className="search"><input placeholder="Search by name or phone…" value={query} onChange={e=>setQuery(e.target.value)} /></div>
          )}
          <div style={{marginLeft:"auto", display:"flex", gap:8}}>
            <button className="btn btn-sm" onClick={()=>setShowImport(true)}>Import Excel</button>
            <button className="btn btn-sm" onClick={()=>exportExcel(leads)}>Export Excel</button>
            <button className="btn btn-sm" onClick={()=>backupJSON(leads)}>Backup</button>
            <button className="btn btn-sm" onClick={()=>restoreInputRef.current.click()}>Restore</button>
            <input ref={restoreInputRef} type="file" accept=".json" style={{display:"none"}} onChange={e=>handleRestoreFile(e, setLeads)} />
            <button className="btn btn-primary" onClick={()=>setShowAdd(true)}>+ Add lead</button>
          </div>
        </div>

        <div className="content">
          {view === "dashboard" && (
            <Dashboard dash={dash} leads={leads} onOpen={(id)=>{setActiveId(id);}} tasks={tasks} />
          )}
          {view === "tasks" && <DailyTasks tasks={tasks} setTasks={setTasks} />}
          {view === "sessions" && <SessionsView leads={leads} onOpen={setActiveId} onUpdate={updateLead} />}
          {view === "clubvisits" && <ClubVisitsView leads={leads} onOpen={setActiveId} onUpdate={updateLead} />}
          {view === "reminders" && <VisitRemindersView leads={leads} onOpen={setActiveId} onUpdate={updateLead} />}
          {view === "bodyrisk" && <BodyRiskView leads={leads} />}
          {view === "billing" && <BillingView leads={leads} />}
          {view === "attendance" && <AttendanceView leads={leads} />}
          {(view === "leads" || view === "archived") && (
            <LeadList
              list={filteredList(view==="leads" ? activeList : archivedList)}
              filters={filters} setFilters={setFilters}
              onOpen={setActiveId}
              isArchiveView={view==="archived"}
            />
          )}
          {view === "reports" && <Reports leads={leads} />}
        </div>
      </div>

      {active && (
        <LeadDrawer
          lead={active}
          onClose={()=>{setActiveId(null); setNoteDraft("");}}
          onUpdate={(patch)=>updateLead(active.id, patch)}
          onAddNote={(entry)=>{addNote(active.id, entry); setNoteDraft("");}}
          onQuickContact={(type)=>logQuickContact(active.id, type)}
          noteDraft={noteDraft} setNoteDraft={setNoteDraft}
          onArchive={(reason)=>{archiveLead(active.id, reason);}}
          onRestore={()=>restoreLead(active.id)}
        />
      )}

      {showAdd && <AddModal onClose={()=>setShowAdd(false)} onSave={addLead} />}
      {showImport && <ImportModal onClose={()=>setShowImport(false)} onImport={(rows)=>{ setLeads(prev => [...rows, ...prev]); setShowImport(false); }} />}
    </div>
  );
}

function Dashboard({ dash, leads, onOpen, tasks }){
  const today = todayStr();
  const todayData = (tasks && tasks[today]) || {};
  return (
    <div>
      <div className="stat-grid">
        <div className="stat-card"><div className="num">{dash.totalLeads}</div><div className="lbl">Total leads</div></div>
        <div className="stat-card"><div className="num">{dash.active_}</div><div className="lbl">Active leads</div></div>
        <div className="stat-card"><div className="num">{dash.archived_}</div><div className="lbl">Archived leads</div></div>
        <div className="stat-card green"><div className="num">{dash.conversionRate}%</div><div className="lbl">Conversion rate</div></div>
        <div className="stat-card hot"><div className="num">{dash.hot}</div><div className="lbl">Hot leads</div></div>
        <div className="stat-card warm"><div className="num">{dash.warm}</div><div className="lbl">Warm leads</div></div>
        <div className="stat-card cold"><div className="num">{dash.cold}</div><div className="lbl">Cold leads</div></div>
        <div className="stat-card"><div className="num">{dash.newThisMonth}</div><div className="lbl">New this month</div></div>
      </div>
      <div className="panel" style={{marginBottom:16}}>
        <h3>Today's activity</h3>
        <div style={{display:"flex", gap:18, flexWrap:"wrap"}}>
          {DAILY_TASKS.map(t => {
            const v = todayData[t.key] || 0;
            const hit = t.min > 0 ? v >= t.min : true;
            return (
              <div key={t.key} style={{minWidth:90}}>
                <div style={{fontSize:11, color:"var(--text-dim)", fontWeight:600}}>{t.icon} {t.label}</div>
                <div style={{fontSize:20, fontWeight:700, color: hit ? "var(--green)" : "var(--text)"}}>{v}{t.min>0 && <span style={{fontSize:12, color:"var(--text-faint)", fontWeight:500}}>/{t.min}</span>}</div>
              </div>
            );
          })}
        </div>
      </div>
      <div className="panel-row">
        <div className="panel">
          <h3>Today's follow-ups ({dash.todayFollowups.length})</h3>
          {dash.todayFollowups.length===0 && <div className="empty-mini">Nothing due today.</div>}
          {dash.todayFollowups.map(l => (
            <div className="mini-row" key={l.id} onClick={()=>onOpen(l.id)} style={{cursor:"pointer"}}>
              <span className="who">{l.name}</span>
              <span className="when">{l.goal}</span>
            </div>
          ))}
        </div>
        <div className="panel">
          <h3>Overdue follow-ups ({dash.overdue.length})</h3>
          {dash.overdue.length===0 && <div className="empty-mini">You're all caught up.</div>}
          {dash.overdue.map(l => (
            <div className="mini-row" key={l.id} onClick={()=>onOpen(l.id)} style={{cursor:"pointer"}}>
              <span className="who">{l.name}</span>
              <span className="when" style={{color:"var(--hot)"}}>{Math.abs(daysBetween(l.nextFollowUp, todayStr()))}d overdue</span>
            </div>
          ))}
        </div>
      </div>
      <div className="panel" style={{marginTop:16}}>
        <h3>Club visits — agreed ({leads.filter(l => l.clubVisitDate && l.clubVisitStatus!=="Visited").length})</h3>
        {(() => {
          const upcoming = leads.filter(l => l.clubVisitDate && l.clubVisitStatus!=="Visited").sort((a,b)=>a.clubVisitDate.localeCompare(b.clubVisitDate));
          if(upcoming.length===0) return <div className="empty-mini">No one has agreed to visit yet.</div>;
          const tomorrow = addDays(today,1);
          return upcoming.map(l => (
            <div className="mini-row" key={l.id} onClick={()=>onOpen(l.id)} style={{cursor:"pointer"}}>
              <span className="who">{l.name}</span>
              <span className="when" style={{color: l.clubVisitDate<=today ? "var(--hot)" : "var(--text-dim)", fontWeight: l.clubVisitDate===today?700:400}}>
                {l.clubVisitDate===today?"Today":l.clubVisitDate===tomorrow?"Tomorrow":fmtDate(l.clubVisitDate)}
              </span>
            </div>
          ));
        })()}
      </div>
    </div>
  );
}

                <td onClick={()=>onOpen(l.id)}>{l.category}</td>
                <td onClick={()=>onOpen(l.id)}>{l.goal}</td>

                    {smsLink(l.phone) && <a className="qa-btn qa-btn-sms" href={smsLink(l.phone)} title="Text message (use if WhatsApp doesn't open)" onClick={e=>e.stopPropagation()}>✉️</a>}
                  </div>

function SessionsView({ leads, onOpen, onUpdate }){
  const invited = leads.filter(l => l.sessionInvited);
  const counts = {
    invited: invited.length,
    joined: invited.filter(l => l.sessionJoined === "Joined").length,
    notJoined: invited.filter(l => l.sessionJoined === "Not Joined").length,
    pending: invited.filter(l => !l.sessionJoined || l.sessionJoined === "Pending").length,
    needR1: invited.filter(l => !l.sessionReminder1Sent).length,
    needR2: invited.filter(l => !l.sessionReminder2Sent).length,
  };

  return (
    <div>
      <div className="stat-grid">
        <div className="stat-card"><div className="num">{counts.invited}</div><div className="lbl">Invited to session</div></div>
        <div className="stat-card green"><div className="num">{counts.joined}</div><div className="lbl">Joined</div></div>
        <div className="stat-card hot"><div className="num">{counts.notJoined}</div><div className="lbl">Did not join</div></div>
        <div className="stat-card warm"><div className="num">{counts.pending}</div><div className="lbl">Awaiting result</div></div>
      </div>

      {invited.length === 0 ? (
        <div className="empty-state">
          <h3>No session invites yet</h3>
          <p>Open a lead and tap "Invite to Session" to start tracking reminders and turnout here.</p>
        </div>
      ) : (
        <table className="lead-table">
          <thead>
            <tr>
              <th>Name</th><th>Invited on</th><th>Reminder 1</th><th>Reminder 2</th><th>Joined?</th><th>Opinion / Feedback</th>
            </tr>
          </thead>
          <tbody>
            {invited.map(l => (
              <tr key={l.id} className="row">
                <td onClick={()=>onOpen(l.id)}><div style={{fontWeight:600}}>{l.name}</div><div style={{color:"var(--text-dim)",fontSize:12}}>{l.phone}</div></td>
                <td onClick={()=>onOpen(l.id)} style={{color:"var(--text-dim)",fontSize:12}}>{fmtDate(l.sessionInviteDate)}</td>
                <td>
                  <span className={"reminder-chip"+(l.sessionReminder1Sent?" sent":"")} onClick={()=>onUpdate(l.id,{sessionReminder1Sent: !l.sessionReminder1Sent})}>
                    {l.sessionReminder1Sent ? "✓ Sent" : "Mark sent"}
                  </span>
                </td>
                <td>
                  <span className={"reminder-chip"+(l.sessionReminder2Sent?" sent":"")} onClick={()=>onUpdate(l.id,{sessionReminder2Sent: !l.sessionReminder2Sent})}>
                    {l.sessionReminder2Sent ? "✓ Sent" : "Mark sent"}
                  </span>
                </td>
                <td onClick={()=>onOpen(l.id)}>
                  <span className={"session-badge "+ (l.sessionJoined==="Joined"?"joined":l.sessionJoined==="Not Joined"?"notjoined":"pending")}>
                    {l.sessionJoined || "Pending"}

                </td>
                <td onClick={()=>onOpen(l.id)} style={{fontSize:12.5, color:"var(--text-dim)", maxWidth:240}}>{l.sessionOpinion || "—"}</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
}

function LeadDrawer({ lead, onClose, onUpdate, onAddNote, onQuickContact, noteDraft, setNoteDraft, onArchive, onRestore }){
  const heat = heatOf(lead);

  const submitNote = () => {
    onAddNote({ body:noteDraft });
  };

  return (
    <div className="overlay" onClick={(e)=>{ if(e.target.className==='overlay') onClose(); }}>
      <div className="drawer">
        <div className="drawer-head">
          <div>
            <h2>{lead.name}</h2>
            <div className="co">{lead.category} · {lead.goal} · <span className={"heat-pill "+heat}>{heat}</span>
              {lead.sessionInvited && <> · <span className={"session-badge "+(lead.sessionJoined==="Joined"?"joined":lead.sessionJoined==="Not Joined"?"notjoined":"pending")}>Session: {lead.sessionJoined||"Pending"}</span></>}
              {lead.clubVisitDate && <> · <span className={"session-badge "+(lead.clubVisitStatus==="Visited"?"joined":lead.clubVisitStatus==="No Show"?"notjoined":"pending")}>Club visit: {fmtDate(lead.clubVisitDate)}</span></>}
            </div>
          </div>
          <button className="close-x" onClick={onClose}>✕</button>
        </div>

        <div className="qa-row">
          {telLink(lead.phone) && <a className="qa-pill" href={telLink(lead.phone)} onClick={()=>onQuickContact("Call")}>📞 Call</a>}
          {waLink(lead.phone) && <a className="qa-pill" href={waLink(lead.phone)} target="_blank" onClick={()=>onQuickContact("WhatsApp Message")}>💬 WhatsApp</a>}
          {smsLink(lead.phone) && <a className="qa-pill" href={smsLink(lead.phone)} onClick={()=>onQuickContact("Text Message")} title="Use if WhatsApp doesn't open for this number">✉️ Text (if no WhatsApp)</a>}
          <button className="qa-pill" onClick={()=>onUpdate({status:"Client"})}>✅ Mark as Client</button>
          <button className="qa-pill" onClick={()=>onUpdate({status:"Business Partner"})}>🤝 Mark as Partner</button>
          {!lead.sessionInvited
            ? <button className="qa-pill" onClick={()=>onUpdate({sessionInvited:true, sessionInviteDate:todayStr(), sessionJoined:"Pending", sessionReminder1Sent:false, sessionReminder2Sent:false})}>📩 Invite to Session</button>
            : <button className="qa-pill" onClick={()=>onUpdate({sessionInvited:false})}>✕ Remove from Session</button>
          }
          {!lead.archived
            ? <button className="qa-pill archive" onClick={()=>{ const r = window.prompt("Reason for archiving (optional)?","Not interested"); onArchive(r); onClose(); }}>🗂 Archive</button>
            : <button className="qa-pill restore" onClick={()=>{ onRestore(); onClose(); }}>↩ Restore</button>
          }
        </div>
        <div style={{fontSize:11.5, color:"var(--text-faint)", margin:"-8px 0 18px"}}>Tapping Call or WhatsApp auto-logs that contact in the history below. If WhatsApp doesn't open for this number, use the Text fallback.</div>

        <div className="field-grid">
          <div className="field"><label>Phone</label><input value={lead.phone} onChange={e=>onUpdate({phone:e.target.value})} /></div>
          <div className="field"><label>Email</label><input value={lead.email} onChange={e=>onUpdate({email:e.target.value})} /></div>
          <div className="field">
            <label>Type</label>
            <select value={lead.category} onChange={e=>onUpdate({category:e.target.value})}>
              <option>Health</option><option>Business</option><option>Both</option>
            </select>
          </div>
          <div className="field">
            <label>Status</label>
            <select value={lead.status} onChange={e=>onUpdate({status:e.target.value})}>
              {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Goal</label>
            <select value={lead.goal} onChange={e=>onUpdate({goal:e.target.value})}>
              {GOALS.map(g => <option key={g} value={g}>{g}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Source</label>
            <select value={lead.source} onChange={e=>onUpdate({source:e.target.value})}>
              {SOURCES.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div className="field"><label>Date added</label><input type="date" value={lead.createdAt ? lead.createdAt.slice(0,10) : ""} onChange={e=>onUpdate({createdAt: e.target.value ? new Date(e.target.value).toISOString() : lead.createdAt})} /></div>
          <div className="field"><label>Last contact</label><input type="date" value={lead.lastContact||""} onChange={e=>onUpdate({lastContact:e.target.value})} /></div>
          <div className="field"><label>Next follow-up</label><input type="date" value={lead.nextFollowUp||""} onChange={e=>onUpdate({nextFollowUp:e.target.value})} /></div>
        </div>

        {lead.sessionInvited && (
          <div>
            <div className="section-title">Session invite</div>
            <div className="session-box">
              <div className="session-row">
                <label>Invited on</label>
                <input type="date" style={{maxWidth:160}} value={lead.sessionInviteDate||""} onChange={e=>onUpdate({sessionInviteDate:e.target.value})} />
              </div>
              <div className="session-row">
                <label>Reminder 1 (send link)</label>
                <span className={"reminder-chip"+(lead.sessionReminder1Sent?" sent":"")} onClick={()=>onUpdate({sessionReminder1Sent: !lead.sessionReminder1Sent})}>
                  {lead.sessionReminder1Sent ? "✓ Sent" : "Mark as sent"}
                </span>
              </div>
              <div className="session-row">
                <label>Reminder 2 (connect to session)</label>
                <span className={"reminder-chip"+(lead.sessionReminder2Sent?" sent":"")} onClick={()=>onUpdate({sessionReminder2Sent: !lead.sessionReminder2Sent})}>
                  {lead.sessionReminder2Sent ? "✓ Sent" : "Mark as sent"}
                </span>
              </div>
              <div className="session-row">
                <label>Did they join?</label>
                <div className="session-toggle">
                  <button className={lead.sessionJoined==="Joined"?"on joined":""} onClick={()=>onUpdate({sessionJoined:"Joined"})}>Joined</button>
                  <button className={lead.sessionJoined==="Not Joined"?"on notjoined":""} onClick={()=>onUpdate({sessionJoined:"Not Joined"})}>Not joined</button>
                  <button className={(!lead.sessionJoined||lead.sessionJoined==="Pending")?"on":""} onClick={()=>onUpdate({sessionJoined:"Pending"})}>Pending</button>
                </div>
              </div>
              <div className="session-field">
                <label style={{display:"block", marginBottom:5}}>Their opinion / feedback about the session</label>
                <textarea placeholder="What did they say after the session…" value={lead.sessionOpinion||""} onChange={e=>onUpdate({sessionOpinion:e.target.value})} />
              </div>
            </div>
          </div>
        )}

        <div className="section-title">Nutrition club visit</div>
        <div className="session-box">
          <div className="session-row">
            <label>Agreed to visit on</label>
            <input type="date" style={{maxWidth:160}} value={lead.clubVisitDate||""} onChange={e=>onUpdate({clubVisitDate:e.target.value, clubVisitStatus: e.target.value ? (lead.clubVisitStatus||"Agreed") : ""})} />
          </div>
          {lead.clubVisitDate && (
            <div className="session-row">
              <label>Visit status</label>
              <div className="session-toggle">
                <button className={lead.clubVisitStatus==="Agreed"||!lead.clubVisitStatus?"on":""} onClick={()=>onUpdate({clubVisitStatus:"Agreed"})}>Agreed</button>
                <button className={lead.clubVisitStatus==="Visited"?"on joined":""} onClick={()=>onUpdate({clubVisitStatus:"Visited"})}>Visited</button>
                <button className={lead.clubVisitStatus==="No Show"?"on notjoined":""} onClick={()=>onUpdate({clubVisitStatus:"No Show"})}>No show</button>
              </div>
            </div>
          )}
        </div>

        <div className="section-title">Notes</div>
        <div className="note-add">
          <textarea placeholder="Add a note…" value={noteDraft} onChange={e=>setNoteDraft(e.target.value)} />
          <button onClick={submitNote}>Add</button>
        </div>

        <div className="section-title">History</div>
        {(!lead.notes || lead.notes.length===0) && <div style={{color:"var(--text-faint)", fontSize:13}}>No notes logged yet.</div>}
        {lead.notes && lead.notes.map((n,i) => (
          <div className="note" key={i}>
            <div className="when">{fmtWhen(n.when)}</div>
            <div className="body">{n.body}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ClubVisitsView({ leads, onOpen, onUpdate }){
  const today = todayStr();
  const tomorrow = addDays(today, 1);
  const withVisit = leads.filter(l => l.clubVisitDate);

  const counts = {
    total: withVisit.length,
    agreed: withVisit.filter(l => (l.clubVisitStatus||"Agreed") === "Agreed").length,
    visited: withVisit.filter(l => l.clubVisitStatus === "Visited").length,
    noShow: withVisit.filter(l => l.clubVisitStatus === "No Show").length,
  };

  const sorted = [...withVisit].sort((a,b) => (a.clubVisitDate||"").localeCompare(b.clubVisitDate||""));

  const dayLabel = (d) => {
    if(d === today) return "Today";
    if(d === tomorrow) return "Tomorrow";
    return fmtDate(d);
  };

  return (
    <div>
      <div className="stat-grid">
        <div className="stat-card"><div className="num">{counts.total}</div><div className="lbl">Agreed to visit</div></div>
        <div className="stat-card warm"><div className="num">{counts.agreed}</div><div className="lbl">Awaiting visit</div></div>
        <div className="stat-card green"><div className="num">{counts.visited}</div><div className="lbl">Visited</div></div>
        <div className="stat-card hot"><div className="num">{counts.noShow}</div><div className="lbl">No show</div></div>
      </div>

      {sorted.length === 0 ? (
        <div className="empty-state">
          <h3>No club visits scheduled yet</h3>
          <p>Open a lead and set "Agreed to visit on" under Nutrition club visit to start tracking it here.</p>
        </div>
      ) : (
        <table className="lead-table">
          <thead>
            <tr>
              <th>Name</th><th>Visit date</th><th>Status</th>
            </tr>
          </thead>
          <tbody>
            {sorted.map(l => (
              <tr key={l.id} className="row">
                <td onClick={()=>onOpen(l.id)}><div style={{fontWeight:600}}>{l.name}</div><div style={{color:"var(--text-dim)",fontSize:12}}>{l.phone}</div></td>

function calcBMI(height, weight){
  const h = Number(height), w = Number(weight);
  if(!h || !w) return "";
  const m = h/100;
  return Math.round((w/(m*m))*10)/10;
}
function calcIdealWeightRange(height){
  const h = Number(height);
  if(!h) return null;
  const m = h/100;
  const lo = Math.round(18.5*m*m*10)/10;
  const hi = Math.round(22.9*m*m*10)/10;
  const mid= Math.round(20.7*m*m*10)/10;
  return { lo, hi, mid };
}
function calcBMREstimate(height, weight, age, gender){
  const h=Number(height), w=Number(weight), a=Number(age);
  if(!h||!w||!a||!gender) return null;
  const base = 10*w + 6.25*h - 5*a;
  return Math.round(gender==="M" ? base+5 : base-161);
}

function tsfStatus(tsf, gender){
  if(tsf===""||tsf===null||tsf===undefined||isNaN(tsf)||!gender) return "";
  tsf = Number(tsf);
  if(gender==="M"){
    if(tsf<=16) return "Normal";
    if(tsf<=25) return "Risky";
    if(tsf<=35) return "Very Risky";
    return "Extreme Risk";
  }
  if(tsf<=30) return "Normal";
  if(tsf<=40) return "Risky";
  if(tsf<=50) return "Very Risky";
  return "Extreme Risk";
}
function bmrStatus(bmr, estimated){
  if(bmr===""||bmr===null||bmr===undefined||isNaN(bmr)||!estimated) return "";
  const diff = ((Number(bmr)-estimated)/estimated)*100;
  if(diff>10) return "High";
  if(diff>=-10) return "Normal";
  if(diff>=-20) return "Low";
  return "Very Low";
}

                        const d = Number(cur[field]) - Number(prv[field]);
                        return d;
                      };
                      const arrow = (d, lowerGood=true) => {
                        if(d===null) return "";
                        const bad = lowerGood ? d>0 : d<0;
                        return d===0 ? " ↔" : bad ? ` ↑${Math.abs(d).toFixed(1)}` : ` ↓${Math.abs(d).toFixed(1)}`;
                      };
                      const arrowColor = (d, lowerGood=true) => {
                        if(d===null||d===0) return "var(--text-dim)";
                        const bad = lowerGood ? d>0 : d<0;
                        return bad ? "var(--hot)" : "var(--green)";
                      };
                      const dW = delta(e, prev, "weight");
                      const dVF = delta(e, prev, "visceralFat");
                      const dBF = delta(e, prev, "bodyFat");
                      const dTSF = delta(e, prev, "tsf");
                      const dSM = delta(e, prev, "skeletalMuscle");
                      return (
                        <tr key={e.id} className="row" onClick={()=>{ loadRecord(e); setWeeklyTab(false); }}>
                          <td style={{fontWeight:600}}>{fmtDate(e.date)}</td>

                          <td>{ebmi}</td>
                          <td style={{color:arrowColor(dVF)}}>{e.visceralFat}{arrow(dVF)}</td>
                          <td style={{color:arrowColor(dBF)}}>{e.bodyFat}{arrow(dBF)}</td>
                          <td style={{color:arrowColor(dTSF)}}>{e.tsf}{arrow(dTSF)}</td>
                          <td style={{color:arrowColor(dSM,false)}}>{e.skeletalMuscle}{arrow(dSM,false)}</td>
                          <td>{e.bmr}</td>
                          <td>{e.bodyAge}</td>
                          <td style={{fontSize:11, color:"var(--text-dim)", maxWidth:140}}>{e.weeklyNote}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <div style={{fontSize:11.5, color:"var(--text-dim)", marginTop:10}}>↑ = increased &nbsp;|&nbsp; ↓ = decreased &nbsp;|&nbsp; ↔ = no change &nbsp;|&nbsp; <span style={{color:"var(--green)"}}>Green</span> = improving &nbsp;|&nbsp; <span style={{color:"var(--hot)"}}>Red</span> = worsening. Click a row to edit that record.</div>
              </div>

              <div className="panel-row" style={{alignItems:"start", flexWrap:"wrap", gap:14}}>
                {[
                  {label:"Weight (kg)", field:"weight", unit:"kg", lowerGood:true},
                  {label:"Visceral Fat %", field:"visceralFat", unit:"%", lowerGood:true},
                  {label:"Body Fat %", field:"bodyFat", unit:"%", lowerGood:true},
                  {label:"Skeletal Muscle %", field:"skeletalMuscle", unit:"%", lowerGood:false},
                ].map(({label,field,unit,lowerGood}) => {
                  const vals = weeklyData.map(e=>Number(e[field]||0)).filter(v=>v>0);
                  if(!vals.length) return null;
                  const min = Math.min(...vals), max = Math.max(...vals), range = max-min||1;
                  return (
                    <div key={field} className="panel" style={{flex:"1 1 200px", minWidth:160}}>
                      <div style={{fontWeight:700, fontSize:13, marginBottom:10}}>{label}</div>
                      <div style={{display:"flex", alignItems:"flex-end", gap:4, height:80}}>
                        {weeklyData.map((e,i) => {
                          const v = Number(e[field]||0);
                          if(!v) return null;
                          const h = Math.max(10, Math.round(((v-min)/range)*70)+10);
                          const prev = weeklyData[i-1];
                          const prevV = prev ? Number(prev[field]||0) : null;
                          const improving = prevV ? (lowerGood ? v<prevV : v>prevV) : null;
                          const col = improving===null?"var(--cold)":improving?"var(--green)":"var(--hot)";
                          return (
                            <div key={e.id} style={{flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:4}}>
                              <div style={{fontSize:9, fontWeight:600, color:"var(--text-dim)"}}>{v}</div>
                              <div style={{width:"100%", height:h, background:col, borderRadius:"4px 4px 0 0", transition:"height 0.3s"}}></div>
                              <div style={{fontSize:8, color:"var(--text-dim)", whiteSpace:"nowrap", overflow:"hidden", maxWidth:38, textOverflow:"ellipsis"}}>{fmtDate(e.date).slice(0,5)}</div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const BILLING_STATUSES = ["Unpaid","Partially Paid","Paid"];
const PAYMENT_MODES = ["Cash","UPI","Bank Transfer","Card","Other"];
function emptyBillItem(){
  return { id: uid(), name:"", category:"", qty:1, price:"" };
}
function emptyBill(){
  return { id: uid(), invoiceNo:"WW"+todayStr().replace(/-/g,"").slice(2), date: todayStr(), leadId:"", clientName:"", clientPhone:"", clientEmail:"",
    items:[ emptyBillItem() ], discountPct:0, taxPct:0, applyTax:false, cost:"", amountPaid:"", mode:"UPI", status:"Unpaid", notes:"" };
}
function billTotals(bill){
  const items = bill.items && bill.items.length ? bill.items : [{qty:1, price:bill.amount||0}];
  const sub = items.reduce((s,it)=>s + (Number(it.qty||0) * Number(it.price||0)), 0);
  const discount = Math.round(sub * (Number(bill.discountPct||0)/100));
  const taxable = sub - discount;
  const tax = bill.applyTax ? Math.round(taxable * (Number(bill.taxPct||0)/100)) : 0;
  const total = taxable + tax;
  return { sub, discount, tax, total };
}
function numberToWordsINR(num){
  num = Math.round(Number(num)||0);
  if(num===0) return "Zero Rupees Only";
  const ones=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const tens=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  function two(n){ if(n<20) return ones[n]; return tens[Math.floor(n/10)] + (n%10? " "+ones[n%10] : ""); }
  function three(n){ if(n>99) return ones[Math.floor(n/100)]+" Hundred"+(n%100? " "+two(n%100):""); return two(n); }
  let n = num, parts=[];
  const crore = Math.floor(n/10000000); n%=10000000;
  const lakh = Math.floor(n/100000); n%=100000;
  const thousand = Math.floor(n/1000); n%=1000;
  const hundred = n;
  if(crore) parts.push(three(crore)+" Crore");
  if(lakh) parts.push(three(lakh)+" Lakh");
  if(thousand) parts.push(three(thousand)+" Thousand");
  if(hundred) parts.push(three(hundred));
  return (parts.join(" ")||"Zero") + " Rupees Only";
}

  };

  const setItem = (itemId, key, val) => {
    setForm(prev => ({...prev, items: prev.items.map(it => it.id===itemId ? {...it, [key]:val} : it)}));
  };
  const addItem = () => setForm(prev => ({...prev, items:[...prev.items, emptyBillItem()]}));
  const removeItem = (itemId) => setForm(prev => ({...prev, items: prev.items.length>1 ? prev.items.filter(it=>it.id!==itemId) : prev.items}));

  const totals = billTotals(form);

  const saveBill = () => {
    if(!form.clientName.trim() || !form.items.some(it=>it.name.trim() && it.price)) return;
    setBills(prev => editingId ? prev.map(b=>b.id===editingId?form:b) : [form, ...prev]);
    setForm(emptyBill()); setEditingId(null);
    setTab("invoices");
  };
  const editBill = (b) => { setForm({...emptyBill(), ...b, items: b.items && b.items.length ? b.items : [emptyBillItem()]}); setEditingId(b.id); setTab("create"); };
  const deleteBill = (id) => { setBills(prev=>prev.filter(b=>b.id!==id)); if(editingId===id){setForm(emptyBill());setEditingId(null);} };
  const cancelEdit = () => { setForm(emptyBill()); setEditingId(null); setTab("invoices"); };

  const billGrandTotal = (b) => billTotals(b).total;
  const totalBilled    = bills.reduce((s,b)=>s+billGrandTotal(b),0);
  const totalCost      = bills.reduce((s,b)=>s+Number(b.cost||0),0);
  const totalCollected = bills.reduce((s,b)=>{ const amt=billGrandTotal(b); const p=b.status==="Paid"?amt:Number(b.amountPaid||0); return s+p; },0);
  const totalDue       = bills.reduce((s,b)=>{ const amt=billGrandTotal(b); const p=b.status==="Paid"?amt:Number(b.amountPaid||0); return s+Math.max(amt-p,0); },0);
  const totalProfit    = totalCollected - totalCost;
  const profitMargin   = totalCollected>0 ? Math.round((totalProfit/totalCollected)*100) : 0;

  // ── Profit analytics ──
  const profitByMonth = useMemo(() => {
    const map = {};
    bills.forEach(b => {
      const d = new Date(b.date || todayStr());
      const key = d.toLocaleString(undefined,{month:"short", year:"numeric"});
      if(!map[key]) map[key] = { key, billed:0, cost:0, collected:0, sortKey: d.getFullYear()*12+d.getMonth() };
      const amt = billGrandTotal(b), cost=Number(b.cost||0);
      const paid = b.status==="Paid" ? amt : Number(b.amountPaid||0);
      map[key].billed += amt; map[key].cost += cost; map[key].collected += paid;
    });
    return Object.values(map).sort((a,b)=>b.sortKey-a.sortKey).map(m=>({...m, profit:m.collected-m.cost}));
  }, [bills]);
  const profitByClient = useMemo(() => {
    const map = {};
    bills.forEach(b => {
      const key = b.clientName || "Unknown";
      if(!map[key]) map[key] = { key, billed:0, cost:0, collected:0 };
      const amt = billGrandTotal(b), cost=Number(b.cost||0);
      const paid = b.status==="Paid" ? amt : Number(b.amountPaid||0);
      map[key].billed += amt; map[key].cost += cost; map[key].collected += paid;
    });
    return Object.values(map).map(m=>({...m, profit:m.collected-m.cost})).sort((a,b)=>b.profit-a.profit);
  }, [bills]);
  const maxMonthProfit = Math.max(1, ...profitByMonth.map(m=>Math.abs(m.profit)));

  const GREEN = "#1c3b2a";
  const GREEN_LT = "#e9f2ea";
  const CREAM = "#faf6ec";
  const GOLD = "#e0a93c";

  return (
    <div style={{background:CREAM, margin:"-24px -26px", padding:"24px 26px", minHeight:"calc(100vh - 60px)"}}>
      {/* ─── Tabs ─── */}
      <div style={{display:"flex", gap:8, marginBottom:20, background:"#fff", padding:6, borderRadius:14, border:"1px solid #ece4d2", width:"fit-content", boxShadow:"0 2px 10px rgba(28,59,42,0.06)"}}>
        <button onClick={()=>{setTab("create"); }} style={{border:"none", cursor:"pointer", padding:"9px 20px", borderRadius:10, fontSize:13, fontWeight:700, fontFamily:"inherit",
          background: tab==="create" ? GREEN : "transparent", color: tab==="create" ? "#fff" : "#6b7a6b"}}>🧾 Create Bill</button>
        <button onClick={()=>setTab("invoices")} style={{border:"none", cursor:"pointer", padding:"9px 20px", borderRadius:10, fontSize:13, fontWeight:700, fontFamily:"inherit",
          background: tab==="invoices" ? GREEN : "transparent", color: tab==="invoices" ? "#fff" : "#6b7a6b"}}>📋 All Invoices</button>
        <button onClick={()=>setTab("profit")} style={{border:"none", cursor:"pointer", padding:"9px 20px", borderRadius:10, fontSize:13, fontWeight:700, fontFamily:"inherit",
          background: tab==="profit" ? GOLD : "transparent", color: tab==="profit" ? "#1c3b2a" : "#6b7a6b"}}>💰 Profit</button>
      </div>

      {tab === "create" && (
        <div style={{display:"grid", gridTemplateColumns:"1fr 320px", gap:18, alignItems:"start"}}>
          <div>
            {/* Header */}
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:14, marginBottom:18}}>
              <div>
                <h2 style={{margin:0, fontSize:24, color:GREEN, letterSpacing:"-0.3px"}}>{editingId?"Edit Bill":"Create Bill"}</h2>
                <div style={{fontSize:12.5, color:"#8a9a8a", marginTop:2}}>Generate invoice for your customer</div>
              </div>
              <div style={{display:"flex", gap:10}}>
                <div style={{background:"#fff", border:"1px solid #ece4d2", borderRadius:10, padding:"8px 14px"}}>
                  <div style={{fontSize:10, color:"#a3ad9a", textTransform:"uppercase", letterSpacing:"0.05em"}}>Invoice No.</div>
                  <div style={{fontSize:13, fontWeight:700, color:GREEN}}>{form.invoiceNo}</div>
                </div>
                <div style={{background:"#fff", border:"1px solid #ece4d2", borderRadius:10, padding:"8px 14px"}}>
                  <div style={{fontSize:10, color:"#a3ad9a", textTransform:"uppercase", letterSpacing:"0.05em"}}>Date</div>
                  <input type="date" value={form.date} onChange={e=>set("date",e.target.value)} style={{border:"none", fontSize:13, fontWeight:700, color:GREEN, background:"transparent", fontFamily:"inherit"}} />
                </div>
              </div>
            </div>

            {/* Add customer */}
            <div style={{background:"#fff", borderRadius:16, border:"1px solid #ece4d2", padding:20, marginBottom:16, boxShadow:"0 2px 12px rgba(28,59,42,0.05)"}}>
              <div style={{fontWeight:700, fontSize:14, marginBottom:10, color:GREEN}}>Add Customer</div>
              <div style={{display:"flex", gap:10, flexWrap:"wrap"}}>
                <select value={form.leadId} onChange={e=>pickLead(e.target.value)} style={{flex:"1 1 240px", background:CREAM, border:"1px solid #ece4d2", borderRadius:10, padding:"10px 14px", fontSize:13, color:GREEN, fontFamily:"inherit"}}>
                  <option value="">🔍 Search customer by name or mobile…</option>
                  {leads.map(l=><option key={l.id} value={l.id}>{l.name} — {l.phone}</option>)}
                </select>
              </div>
              <div className="field-grid" style={{marginTop:12}}>
                <div className="field"><label>Client name</label><input value={form.clientName} onChange={e=>set("clientName",e.target.value)} placeholder="Customer name" /></div>
                <div className="field"><label>Phone</label><input value={form.clientPhone} onChange={e=>set("clientPhone",e.target.value)} placeholder="9876543210" /></div>
                <div className="field"><label>Email (optional)</label><input value={form.clientEmail} onChange={e=>set("clientEmail",e.target.value)} placeholder="email@example.com" /></div>
              </div>
            </div>

            {/* Line items */}
            <div style={{background:"#fff", borderRadius:16, border:"1px solid #ece4d2", padding:20, marginBottom:16, boxShadow:"0 2px 12px rgba(28,59,42,0.05)"}}>
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%", borderCollapse:"collapse"}}>
                  <thead>
                    <tr style={{background:GREEN}}>
                      <th style={{padding:"10px 12px", textAlign:"left", fontSize:11, color:"#fff", fontWeight:700, borderRadius:"8px 0 0 8px"}}>#</th>
                      <th style={{padding:"10px 12px", textAlign:"left", fontSize:11, color:"#fff", fontWeight:700}}>Item / Service</th>
                      <th style={{padding:"10px 12px", textAlign:"left", fontSize:11, color:"#fff", fontWeight:700}}>Category</th>
                      <th style={{padding:"10px 12px", textAlign:"center", fontSize:11, color:"#fff", fontWeight:700}}>Qty</th>
                      <th style={{padding:"10px 12px", textAlign:"right", fontSize:11, color:"#fff", fontWeight:700}}>Price (₹)</th>
                      <th style={{padding:"10px 12px", textAlign:"right", fontSize:11, color:"#fff", fontWeight:700}}>Total (₹)</th>
                      <th style={{padding:"10px 12px", fontSize:11, color:"#fff", fontWeight:700, borderRadius:"0 8px 8px 0"}}></th>
                    </tr>
                  </thead>
                  <tbody>
                    {form.items.map((it, i) => (
                      <tr key={it.id} style={{borderBottom:"1px solid #f1ede0"}}>
                        <td style={{padding:"10px 12px", color:"#a3ad9a", fontWeight:600}}>{i+1}</td>
                        <td style={{padding:"10px 12px"}}><input value={it.name} onChange={e=>setItem(it.id,"name",e.target.value)} placeholder="Item or service name" style={{width:"100%", border:"1px solid #ece4d2", borderRadius:8, padding:"7px 10px", fontSize:13, fontFamily:"inherit"}} /></td>
                        <td style={{padding:"10px 12px"}}><input value={it.category} onChange={e=>setItem(it.id,"category",e.target.value)} placeholder="Category" style={{width:"100%", border:"1px solid #ece4d2", borderRadius:8, padding:"7px 10px", fontSize:13, fontFamily:"inherit"}} /></td>
                        <td style={{padding:"10px 12px", textAlign:"center"}}><input type="number" min="1" value={it.qty} onChange={e=>setItem(it.id,"qty",e.target.value)} style={{width:60, border:"1px solid #ece4d2", borderRadius:8, padding:"7px 8px", fontSize:13, textAlign:"center", fontFamily:"inherit"}} /></td>
                        <td style={{padding:"10px 12px", textAlign:"right"}}><input type="number" value={it.price} onChange={e=>setItem(it.id,"price",e.target.value)} placeholder="0.00" style={{width:90, border:"1px solid #ece4d2", borderRadius:8, padding:"7px 10px", fontSize:13, textAlign:"right", fontFamily:"inherit"}} /></td>
                        <td style={{padding:"10px 12px", textAlign:"right", fontWeight:700, color:GREEN}}>₹{(Number(it.qty||0)*Number(it.price||0)).toLocaleString()}</td>
                        <td style={{padding:"10px 12px", textAlign:"center"}}><button onClick={()=>removeItem(it.id)} style={{border:"none", background:"none", cursor:"pointer", color:"#c0392b", fontSize:15}} title="Remove item">🗑</button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <button onClick={addItem} style={{marginTop:12, border:"1px dashed #ece4d2", background:CREAM, color:GREEN, borderRadius:10, padding:"8px 16px", fontSize:13, fontWeight:700, cursor:"pointer", fontFamily:"inherit"}}>+ Add Item / Service</button>
            </div>

            {/* Payment method / notes */}
            <div style={{background:"#fff", borderRadius:16, border:"1px solid #ece4d2", padding:20, marginBottom:16, boxShadow:"0 2px 12px rgba(28,59,42,0.05)"}}>
              <div className="field-grid">
                <div className="field">
                  <label>Payment Method</label>
                  <select value={form.mode} onChange={e=>set("mode",e.target.value)}>{PAYMENT_MODES.map(m=><option key={m}>{m}</option>)}</select>
                </div>
                <div className="field">
                  <label>Status</label>
                  <select value={form.status} onChange={e=>set("status",e.target.value)}>{BILLING_STATUSES.map(s=><option key={s}>{s}</option>)}</select>
                </div>
                <div className="field"><label>Amount paid so far (₹)</label><input type="number" value={form.amountPaid} onChange={e=>set("amountPaid",e.target.value)} /></div>
                <div className="field"><label>Cost / expense (₹) — internal only</label><input type="number" value={form.cost} onChange={e=>set("cost",e.target.value)} placeholder="for profit tracking" /></div>
                <div className="field" style={{gridColumn:"span 2"}}><label>Notes (optional)</label><input value={form.notes} onChange={e=>set("notes",e.target.value)} placeholder="Add a note…" /></div>
              </div>

              <div style={{display:"flex", gap:14, flexWrap:"wrap", alignItems:"center", background:CREAM, borderRadius:12, padding:"14px 16px", marginTop:6}}>
                <div style={{display:"flex", alignItems:"center", gap:8}}>
                  <span style={{fontSize:13, fontWeight:600, color:GREEN}}>🏷 Apply Discount</span>
                  <input type="number" value={form.discountPct} onChange={e=>set("discountPct",e.target.value)} style={{width:60, border:"1px solid #ece4d2", borderRadius:8, padding:"6px 8px", fontSize:13, fontFamily:"inherit"}} />
                  <span style={{fontSize:13, color:"#8a9a8a"}}>%</span>
                </div>
                <div style={{display:"flex", alignItems:"center", gap:8, marginLeft:"auto"}}>
                  <span style={{fontSize:13, fontWeight:600, color:GREEN}}>🧾 Apply Tax</span>
                  <input type="number" value={form.taxPct} onChange={e=>set("taxPct",e.target.value)} disabled={!form.applyTax} style={{width:60, border:"1px solid #ece4d2", borderRadius:8, padding:"6px 8px", fontSize:13, fontFamily:"inherit", opacity:form.applyTax?1:0.5}} />
                  <span style={{fontSize:13, color:"#8a9a8a"}}>%</span>
                  <label style={{position:"relative", display:"inline-block", width:38, height:20, marginLeft:4}}>
                    <input type="checkbox" checked={form.applyTax} onChange={e=>set("applyTax",e.target.checked)} style={{opacity:0, width:0, height:0}} />
                    <span onClick={()=>set("applyTax",!form.applyTax)} style={{position:"absolute", cursor:"pointer", inset:0, background:form.applyTax?GREEN:"#d8d2c0", borderRadius:20, transition:"0.2s"}}>
                      <span style={{position:"absolute", height:14, width:14, left:form.applyTax?20:3, top:3, background:"#fff", borderRadius:"50%", transition:"0.2s"}}></span>
                    </span>
                  </label>
                </div>
              </div>
            </div>

            <div style={{display:"flex", gap:10, flexWrap:"wrap"}}>
              <button className="btn" onClick={cancelEdit}>Cancel</button>
              <button className="btn" onClick={()=>{ saveBill(); }}>💾 Save Draft</button>
              <button onClick={saveBill} disabled={!form.clientName.trim()} style={{background:GREEN, color:"#fff", border:"none", borderRadius:10, padding:"10px 22px", fontSize:13.5, fontWeight:700, cursor:"pointer", opacity:form.clientName.trim()?1:0.5, fontFamily:"inherit"}}>🖨 {editingId?"Update Bill":"Generate Bill"}</button>
            </div>
          </div>

          {/* ── Right sidebar: customer + summary ── */}
          <div>
            <div style={{background:"#fff", borderRadius:16, border:"1px solid #ece4d2", padding:18, marginBottom:14, boxShadow:"0 2px 12px rgba(28,59,42,0.05)"}}>
              <div style={{fontWeight:700, fontSize:13.5, color:GREEN, marginBottom:10}}>Customer Details</div>
              <div style={{display:"flex", gap:10, alignItems:"center"}}>
                <div style={{width:42, height:42, borderRadius:"50%", background:GREEN_LT, display:"flex", alignItems:"center", justifyContent:"center", fontSize:18}}>👤</div>
                <div>
                  <div style={{fontWeight:700, fontSize:13.5}}>{form.clientName || "—"}</div>
                  <div style={{fontSize:11.5, color:"#8a9a8a"}}>{form.clientPhone || "No phone"}</div>
                  <div style={{fontSize:11.5, color:"#8a9a8a"}}>{form.clientEmail || ""}</div>
                </div>
              </div>
            </div>

            <div style={{background:"#fff", borderRadius:16, border:"1px solid #ece4d2", padding:18, marginBottom:14, boxShadow:"0 2px 12px rgba(28,59,42,0.05)"}}>
              <div style={{fontWeight:700, fontSize:13.5, color:GREEN, marginBottom:10}}>Bill Summary</div>
              <div style={{fontSize:13, display:"flex", justifyContent:"space-between", padding:"5px 0", color:"#5b6b5b"}}><span>Sub Total</span><span>₹{totals.sub.toLocaleString()}</span></div>
              {totals.discount>0 && <div style={{fontSize:13, display:"flex", justifyContent:"space-between", padding:"5px 0", color:"#c0631f"}}><span>Discount</span><span>- ₹{totals.discount.toLocaleString()}</span></div>}
              {form.applyTax && <div style={{fontSize:13, display:"flex", justifyContent:"space-between", padding:"5px 0", color:"#5b6b5b"}}><span>Tax ({form.taxPct||0}%)</span><span>₹{totals.tax.toLocaleString()}</span></div>}
              <div style={{borderTop:"1px solid #ece4d2", marginTop:8, paddingTop:10}}>
                <div style={{fontSize:12, color:"#8a9a8a"}}>Total Amount</div>
                <div style={{fontSize:22, fontWeight:800, color:GREEN}}>₹{totals.total.toLocaleString()}</div>
              </div>
            </div>

            <div style={{background:GREEN, borderRadius:16, padding:18, color:"#fff", marginBottom:14, boxShadow:"0 6px 18px rgba(28,59,42,0.2)"}}>
              <div style={{fontSize:11.5, opacity:0.8, textTransform:"uppercase", letterSpacing:"0.05em"}}>Amount Payable</div>
              <div style={{fontSize:26, fontWeight:800, marginTop:4}}>₹{totals.total.toLocaleString()}</div>
              <div style={{fontSize:11, opacity:0.8, marginTop:6, lineHeight:1.4}}>In Words: {numberToWordsINR(totals.total)}</div>
            </div>

            <div style={{background:"#fdf6e3", border:"1px solid #f0e2b8", borderRadius:14, padding:14, fontSize:12, color:GREEN, display:"flex", gap:8, alignItems:"flex-start"}}>
              <span>🌿</span><span>Thank you for choosing Wellwish Wellness Center!</span>
            </div>
          </div>
        </div>
      )}

      {tab === "invoices" && (
        <div>
          <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))", gap:14, marginBottom:20}}>
            {[
              {label:"Total Billed", val:"₹"+totalBilled.toLocaleString(), sub:"gross revenue", icon:"🧾"},
              {label:"Collected", val:"₹"+totalCollected.toLocaleString(), sub:"cash in hand", icon:"✅"},
              {label:"Outstanding", val:"₹"+totalDue.toLocaleString(), sub:"pending dues", icon:"⏳"},
              {label:"Invoices", val:bills.length, sub:"all entries", icon:"📋"},
            ].map(({label,val,sub,icon}) => (
              <div key={label} style={{background:GREEN, borderRadius:16, padding:"18px 20px", color:"#fff", boxShadow:"0 6px 18px rgba(28,59,42,0.15)", minHeight:104, display:"flex", flexDirection:"column", justifyContent:"space-between"}}>
                <div style={{fontSize:22}}>{icon}</div>
                <div>
                  <div style={{fontSize:24, fontWeight:800, letterSpacing:"-0.5px"}}>{val}</div>
                  <div style={{fontSize:12.5, fontWeight:600, opacity:0.9, marginTop:3}}>{label}</div>
                  <div style={{fontSize:11, opacity:0.75, marginTop:1}}>{sub}</div>
                </div>
              </div>
            ))}
          </div>

          <div style={{background:"#fff", borderRadius:16, border:"1px solid #ece4d2", padding:22, boxShadow:"0 2px 12px rgba(28,59,42,0.05)"}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14}}>
              <h3 style={{margin:0, color:GREEN}}>All invoices ({bills.length})</h3>
              <button onClick={()=>{ setForm(emptyBill()); setEditingId(null); setTab("create"); }} style={{background:GREEN, color:"#fff", border:"none", borderRadius:10, padding:"8px 16px", fontSize:12.5, fontWeight:700, cursor:"pointer", fontFamily:"inherit"}}>+ New Bill</button>
            </div>
            {bills.length === 0 ? (
              <div style={{textAlign:"center", padding:"48px 20px", color:"#8a9a8a"}}>
                <div style={{fontSize:34, marginBottom:10}}>🧾</div>
                <div style={{fontSize:14.5, fontWeight:700, color:GREEN, marginBottom:4}}>No billing entries yet</div>

              </div>
            ) : (
              <div style={{overflowX:"auto"}}>
                <table className="lead-table">
                  <thead>
                    <tr>
                      <th>Invoice</th><th>Date</th><th>Client</th><th>Items</th><th>Total</th><th>Paid</th><th>Due</th><th>Mode</th><th>Status</th><th></th><th></th>

                      const amt=billGrandTotal(b);
                      const paid=b.status==="Paid"?amt:Number(b.amountPaid||0);
                      const due=Math.max(amt-paid,0);
                      const itemCount = b.items ? b.items.length : 1;
                      return (
                        <tr key={b.id} className="row">
                          <td onClick={()=>editBill(b)} style={{fontWeight:700, color:GREEN}}>{b.invoiceNo||"—"}</td>
                          <td onClick={()=>editBill(b)}>{fmtDate(b.date)}</td>
                          <td onClick={()=>editBill(b)} style={{fontWeight:700}}>{b.clientName}</td>
