              <div>
                <div style={{fontSize:11.5, opacity:0.8}}>Profit margin</div>
                <div style={{fontSize:18, fontWeight:700}}>{profitMargin}%</div>
              </div>
              <div>
                <div style={{fontSize:11.5, opacity:0.8}}>Still outstanding</div>
                <div style={{fontSize:18, fontWeight:700}}>₹{totalDue.toLocaleString()}</div>
              </div>
            </div>
          </div>

          <div style={{background:"#fff", borderRadius:16, border:"1px solid #ece4d2", padding:22, marginBottom:18, boxShadow:"0 2px 12px rgba(28,59,42,0.05)"}}>
            <h3 style={{marginBottom:14, color:GREEN}}>Profit by month</h3>
            {profitByMonth.length === 0 ? (
              <div className="empty-mini">No data yet — create invoices to see monthly profit trends.</div>
            ) : (
              <div>
                {profitByMonth.map(m => (
                  <div key={m.key} style={{marginBottom:14}}>
                    <div style={{display:"flex", justifyContent:"space-between", fontSize:12.5, marginBottom:4}}>
                      <span style={{fontWeight:700}}>{m.key}</span>
                      <span style={{color:m.profit>=0?"#1c7a3e":"#c0392b", fontWeight:700}}>₹{m.profit.toLocaleString()}</span>
                    </div>
                    <div style={{height:10, background:"#f1ede0", borderRadius:6, overflow:"hidden"}}>
                      <div style={{height:"100%", width:Math.max(3,Math.round((Math.abs(m.profit)/maxMonthProfit)*100))+"%",
                        background: m.profit>=0 ? "linear-gradient(90deg,#1c7a3e,#3dab63)" : "linear-gradient(90deg,#c0392b,#e0604a)",
                        borderRadius:6}}></div>
                    </div>
                    <div style={{fontSize:10.5, color:"#8a9a8a", marginTop:3}}>Billed ₹{m.billed.toLocaleString()} · Collected ₹{m.collected.toLocaleString()} · Cost ₹{m.cost.toLocaleString()}</div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div style={{background:"#fff", borderRadius:16, border:"1px solid #ece4d2", padding:22, boxShadow:"0 2px 12px rgba(28,59,42,0.05)"}}>
            <h3 style={{marginBottom:14, color:GREEN}}>Profit by client</h3>
            {profitByClient.length === 0 ? (
              <div className="empty-mini">No data yet.</div>
            ) : (
              <div style={{overflowX:"auto"}}>
                <table className="lead-table">
                  <thead><tr><th>Client</th><th>Billed</th><th>Collected</th><th>Cost</th><th>Profit</th><th>Margin</th></tr></thead>
                  <tbody>
                    {profitByClient.map(c => {
                      const margin = c.collected>0 ? Math.round((c.profit/c.collected)*100) : 0;
                      return (
                        <tr key={c.key}>
                          <td style={{fontWeight:700}}>{c.key}</td>
                          <td>₹{c.billed.toLocaleString()}</td>
                          <td style={{color:"#1c7a3e"}}>₹{c.collected.toLocaleString()}</td>
                          <td style={{color:"#8a9a8a"}}>₹{c.cost.toLocaleString()}</td>
                          <td style={{fontWeight:700, color:c.profit>=0?"#1c7a3e":"#c0392b"}}>₹{c.profit.toLocaleString()}</td>
                          <td style={{color:"#8a9a8a"}}>{margin}%</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Attendance ────────────────────────────────────────────────────────────
const ATT_MEMBER_KEY = "wellwish_att_members_v1";
function loadAttMembers(){ try{ const r=localStorage.getItem(ATT_MEMBER_KEY); if(r) return JSON.parse(r); }catch(e){} return []; }
function saveAttMembers(list){ try{ localStorage.setItem(ATT_MEMBER_KEY, JSON.stringify(list)); }catch(e){} }

function emptyAttendanceRecord(date, mode){
  return { id: uid(), date, mode, entries: {} };
}
function AttendanceView({ leads }){
  const [records, setRecords] = useState(loadAttendance);
  const [extraMembers, setExtraMembers] = useState(loadAttMembers);
  const [date, setDate] = useState(todayStr());
  const [mode, setMode] = useState("Physical");
  const [showAddMember, setShowAddMember] = useState(false);
  const [newMemberName, setNewMemberName] = useState("");
  const [newMemberPhone, setNewMemberPhone] = useState("");
  useEffect(()=>{ saveAttendance(records); }, [records]);
  useEffect(()=>{ saveAttMembers(extraMembers); }, [extraMembers]);

  const allMembers = extraMembers.map(m=>({id:m.id, name:m.name, phone:m.phone, source:"member"}));

  const current = records.find(r=>r.date===date && r.mode===mode) || emptyAttendanceRecord(date, mode);

  const setEntry = (memberId, status) => {
    setRecords(prev => {
      const exists = prev.find(r=>r.date===date && r.mode===mode);
      if(exists) return prev.map(r => r===exists ? {...r, entries:{...r.entries, [memberId]:status}} : r);
      const rec = emptyAttendanceRecord(date, mode);
      rec.entries[memberId] = status;
      return [rec, ...prev];
    });
  };
  const clearEntry = (memberId) => {
    setRecords(prev => {
      const exists = prev.find(r=>r.date===date && r.mode===mode);
      if(!exists) return prev;
      const entries = {...exists.entries};
      delete entries[memberId];
      return prev.map(r => r===exists ? {...r, entries} : r);
    });
  };
  const markAll = (status) => {
    setRecords(prev => {
      const exists = prev.find(r=>r.date===date && r.mode===mode);
      const entries = {}; allMembers.forEach(m=>entries[m.id]=status);
      if(exists) return prev.map(r => r===exists ? {...r, entries:{...r.entries,...entries}} : r);
      const rec = emptyAttendanceRecord(date, mode); rec.entries = entries;
      return [rec, ...prev];
    });
  };
  const clearAll = () => {
    setRecords(prev => {
      const exists = prev.find(r=>r.date===date && r.mode===mode);
      if(!exists) return prev;
      return prev.map(r => r===exists ? {...r, entries:{}} : r);
    });
  };

  const addMember = () => {
    if(!newMemberName.trim()) return;
    setExtraMembers(prev => [...prev, { id: uid(), name:newMemberName.trim(), phone:newMemberPhone.trim() }]);
    setNewMemberName(""); setNewMemberPhone(""); setShowAddMember(false);
  };
  const removeMember = (id) => setExtraMembers(prev => prev.filter(m=>m.id!==id));

  const presentCount = allMembers.filter(m=>current.entries[m.id]==="Present").length;
  const absentCount  = allMembers.filter(m=>current.entries[m.id]==="Absent").length;
  const unmarked     = allMembers.length - presentCount - absentCount;
  const history = [...records].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30);

  return (
    <div>
      {/* Header controls */}
      <div style={{background:"#fff", borderRadius:16, border:"1px solid var(--border-2)", padding:20, marginBottom:16, boxShadow:"0 2px 12px rgba(0,0,0,0.04)"}}>
        <div style={{display:"flex", gap:14, flexWrap:"wrap", alignItems:"center", marginBottom:16}}>
          <div className="field" style={{maxWidth:200, margin:0}}>
            <label>Date</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} />
          </div>
          <div className="tab-row" style={{margin:0}}>
            <div className={"tab"+(mode==="Physical"?" active":"")} onClick={()=>setMode("Physical")}>🏠 Physical</div>
            <div className={"tab"+(mode==="Virtual"?" active":"")} onClick={()=>setMode("Virtual")}>💻 Virtual</div>
          </div>
          <div style={{marginLeft:"auto", display:"flex", gap:8, flexWrap:"wrap"}}>
            <button className="btn btn-sm" onClick={()=>markAll("Present")}>✓ Mark all present</button>
            <button className="btn btn-sm" onClick={()=>markAll("Absent")}>✗ Mark all absent</button>
            <button className="btn btn-sm" onClick={clearAll} style={{color:"var(--hot)"}}>🗑 Clear all</button>
            <button className="btn btn-sm btn-primary" onClick={()=>setShowAddMember(!showAddMember)}>+ Add member</button>
          </div>
        </div>

        {showAddMember && (
          <div style={{background:"var(--bg-2)", borderRadius:12, padding:"14px 16px", marginBottom:14, display:"flex", gap:10, alignItems:"flex-end", flexWrap:"wrap"}}>
            <div className="field" style={{margin:0, flex:"1 1 160px"}}>
              <label>Member name</label>
              <input value={newMemberName} onChange={e=>setNewMemberName(e.target.value)} placeholder="Full name" />
            </div>
            <div className="field" style={{margin:0, flex:"1 1 140px"}}>
              <label>Phone (optional)</label>
              <input value={newMemberPhone} onChange={e=>setNewMemberPhone(e.target.value)} placeholder="+91…" />
            </div>
            <div style={{display:"flex", gap:8}}>
              <button className="btn btn-primary" onClick={addMember} disabled={!newMemberName.trim()} style={{opacity:newMemberName.trim()?1:0.5}}>Add</button>
              <button className="btn" onClick={()=>setShowAddMember(false)}>Cancel</button>
            </div>
          </div>
        )}

        <div style={{display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:12}}>
          {[
            {val:presentCount, lbl:"Present", col:"linear-gradient(135deg,#19a566,#3dd68c)"},
            {val:absentCount,  lbl:"Absent",  col:"linear-gradient(135deg,#e05e2f,#f09060)"},
            {val:unmarked,     lbl:"Unmarked", col:"linear-gradient(135deg,#4a5568,#718096)"},
            {val:allMembers.length, lbl:"Total", col:"linear-gradient(135deg,#3563e9,#5b8def)"},
          ].map(({val,lbl,col})=>(
            <div key={lbl} style={{background:col, borderRadius:12, padding:"14px 16px", color:"#fff", textAlign:"center"}}>
              <div style={{fontSize:24, fontWeight:800}}>{val}</div>
              <div style={{fontSize:11, fontWeight:600, opacity:0.85, marginTop:2}}>{lbl}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Register table */}
      <div style={{background:"#fff", borderRadius:16, border:"1px solid var(--border-2)", padding:22, marginBottom:16, boxShadow:"0 2px 12px rgba(0,0,0,0.04)"}}>
        <h3 style={{marginBottom:14}}>{mode} register — {fmtDate(date)} ({allMembers.length} members)</h3>
        {allMembers.length === 0 ? (
          <div className="empty-mini">No members yet — use "Add member" above to add your gym/club members for attendance.</div>
        ) : (
          <table className="lead-table">
            <thead>
              <tr><th>#</th><th>Name</th><th>Phone</th><th>Mark attendance</th><th>Clear</th><th></th></tr>
            </thead>
            <tbody>
              {allMembers.map((m, idx) => {
                const status = current.entries[m.id] || "";
                return (
                  <tr key={m.id} className="row" style={status==="Present"?{background:"#f0faf5"}:status==="Absent"?{background:"#fff6f4"}:{}}>
                    <td style={{color:"var(--text-dim)", fontWeight:600}}>{idx+1}</td>
                    <td style={{fontWeight:700}}>{m.name}</td>
                    <td style={{color:"var(--text-dim)"}}>{m.phone||"—"}</td>
                    <td>
                      <div style={{display:"flex", gap:6}}>
                        <button className="btn btn-sm" style={status==="Present"?{background:"#e8f5ee",borderColor:"#a8d9be",color:"#19a566",fontWeight:700}:{}} onClick={()=>setEntry(m.id,"Present")}>✓ Present</button>
                        <button className="btn btn-sm" style={status==="Absent"?{background:"#fde9e6",borderColor:"#f5c0b8",color:"#e04040",fontWeight:700}:{}} onClick={()=>setEntry(m.id,"Absent")}>✗ Absent</button>
                      </div>
                    </td>
                    <td>
                      <button className="btn btn-sm" onClick={()=>clearEntry(m.id)} title="Clear this person's attendance" style={{color:"var(--text-dim)"}}>🗑 Clear</button>
                    </td>
                    <td>
                      <button className="btn btn-sm" onClick={()=>removeMember(m.id)} style={{color:"var(--hot)"}} title="Remove this member">Remove</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {/* History */}
      <div style={{background:"#fff", borderRadius:16, border:"1px solid var(--border-2)", padding:22, boxShadow:"0 2px 12px rgba(0,0,0,0.04)"}}>
        <h3 style={{marginBottom:14}}>Attendance history</h3>
        {history.length === 0 ? <div className="empty-mini">No history yet.</div> : (
          <table className="lead-table">
            <thead><tr><th>Date</th><th>Mode</th><th>Present</th><th>Absent</th><th>Total</th></tr></thead>
            <tbody>
              {history.map(r => {
                const p=Object.values(r.entries).filter(v=>v==="Present").length;
                const a=Object.values(r.entries).filter(v=>v==="Absent").length;
                return (
                  <tr key={r.id}>
                    <td>{fmtDate(r.date)}</td>
                    <td>{r.mode==="Virtual"?"💻 Virtual":"🏠 Physical"}</td>
                    <td style={{color:"#19a566",fontWeight:700}}>{p}</td>
                    <td style={{color:"#e04040",fontWeight:700}}>{a}</td>
                    <td style={{color:"var(--text-dim)"}}>{p+a}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}



function AddModal({ onClose, onSave }){
  const [name,setName] = useState("");
  const [phone,setPhone] = useState("");
  const [email,setEmail] = useState("");
  const [category,setCategory] = useState("Health");
  const [goal,setGoal] = useState(GOALS[0]);
  const [source,setSource] = useState(SOURCES[0]);
  const firstRef = useRef(null);
  useEffect(()=>{ firstRef.current && firstRef.current.focus(); },[]);
  const canSave = name.trim() && phone.trim();

  return (
    <div className="modal-overlay" onClick={(e)=>{ if(e.target.className==='modal-overlay') onClose(); }}>
      <div className="modal">
        <h3>Add a lead</h3>
        <div className="field"><label>Name</label><input ref={firstRef} value={name} onChange={e=>setName(e.target.value)} /></div>
        <div className="field"><label>Phone</label><input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="+91…" /></div>
        <div className="field"><label>Email</label><input value={email} onChange={e=>setEmail(e.target.value)} /></div>
        <div className="field">
          <label>Type</label>
          <select value={category} onChange={e=>setCategory(e.target.value)}>
            <option>Health</option><option>Business</option><option>Both</option>
          </select>
        </div>
        <div className="field">
          <label>Goal</label>
          <select value={goal} onChange={e=>setGoal(e.target.value)}>
            {GOALS.map(g => <option key={g} value={g}>{g}</option>)}
          </select>
        </div>
        <div className="field">
          <label>Source</label>
          <select value={source} onChange={e=>setSource(e.target.value)}>
            {SOURCES.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        </div>
        <div className="modal-actions">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" disabled={!canSave} style={{opacity:canSave?1:0.5}} onClick={()=>canSave && onSave({name,phone,email,category,goal,source})}>Add lead</button>
        </div>
      </div>
    </div>
  );
}
